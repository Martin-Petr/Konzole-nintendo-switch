<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Theme Demo</title>

    <!-- Propojení CSS -->
    <link rel="stylesheet" href="nintendo.css">
    <a href="index.html">index</a>
</head>

<body>
    <div class="container">
        <h1>Nintendo Theme</h1>

        <h2>Ukázkové tlačítka</h2>
        <button class="btn">Červené tlačítko</button>
        <button class="btn btn-blue">Modré tlačítko</button>

        <h3>Retro rámeček</h3>
        <div class="frame">
            Toto je obsah uvnitř retro NES rámečku.
        </div>

        <h3>Odrážky</h3>
        <ul>
            <li>Mario</li>
            <li>Zelda</li>
            <li>Pokémon</li>
        </ul>

        <p>Více stylů můžu doplnit kdykoliv.</p>
    </div>
</body>
</html>
